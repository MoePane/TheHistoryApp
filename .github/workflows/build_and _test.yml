name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main 
       workflow_dispatch

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: '11'

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build and test
      run: ./gradlew test

